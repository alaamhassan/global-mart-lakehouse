<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="960" height="600" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">Global Mart Lakehouse: Phase 1 Architecture</text>
  <text x="30" y="64" font-size="13" fill="#64748b">Implemented in v0.1.0 (solid) and planned next (dashed)</text>

  <!-- cluster -->
  <rect x="24" y="84" width="650" height="492" rx="12" fill="#f8fafc" stroke="#326CE5" stroke-width="2"/>
  <text x="42" y="110" font-size="14" font-weight="700" fill="#326CE5">Kubernetes cluster (k3s, single node, local-path storage)</text>

  <!-- storage ns -->
  <rect x="44" y="126" width="610" height="296" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="58" y="148" font-size="12" font-weight="600" fill="#475569">namespace: storage</text>

  <!-- hive -->
  <rect x="64" y="164" width="250" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="80" y="190" font-size="15" font-weight="700" fill="#9a3412">Hive Metastore</text>
  <text x="80" y="210" font-size="12" fill="#7c2d12">Deployment · apache/hive 4.0.0</text>
  <text x="80" y="228" font-size="12" fill="#7c2d12">Init container: schematool schema init</text>
  <text x="80" y="246" font-size="12" fill="#7c2d12">Thrift :9083 · Service (ClusterIP)</text>
  <text x="80" y="264" font-size="12" fill="#7c2d12">Probes + resource limits</text>
  <text x="80" y="282" font-size="12" fill="#7c2d12">Custom image (+ MySQL JDBC driver)</text>

  <!-- mysql -->
  <rect x="64" y="318" width="250" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="344" font-size="15" font-weight="700" fill="#1e3a8a">MySQL 8.0</text>
  <text x="80" y="364" font-size="12" fill="#1e40af">StatefulSet · 10Gi PVC</text>
  <text x="80" y="382" font-size="12" fill="#1e40af">Headless svc: mysql-hms-headless:3306</text>
  <text x="80" y="398" font-size="12" fill="#1e40af">Metastore database (metadata only)</text>

  <!-- minio -->
  <rect x="384" y="164" width="250" height="130" rx="10" fill="#fef2f2" stroke="#c72e49" stroke-width="2"/>
  <text x="400" y="190" font-size="15" font-weight="700" fill="#9f1239">MinIO</text>
  <text x="400" y="210" font-size="12" fill="#881337">StatefulSet · 50Gi PVC</text>
  <text x="400" y="228" font-size="12" fill="#881337">S3 API :9000 · Console :9090</text>
  <text x="400" y="246" font-size="12" fill="#881337">Headless svc: minio-headless</text>
  <text x="400" y="264" font-size="11.5" fill="#881337">Warehouse: s3a://globalmart-warehouse</text>
  <text x="400" y="282" font-size="12" fill="#881337">Health probes (ready / live)</text>

  <!-- config -->
  <rect x="384" y="318" width="250" height="88" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="344" font-size="15" font-weight="700" fill="#14532d">Config &amp; Secrets</text>
  <text x="400" y="364" font-size="12" fill="#166534">ConfigMaps: storage-env, hive-site</text>
  <text x="400" y="382" font-size="12" fill="#166534">Secrets: mysql-secret, minio-secret</text>
  <text x="400" y="398" font-size="12" fill="#166534">(secret files are never committed)</text>

  <!-- smoke test -->
  <rect x="44" y="444" width="610" height="116" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="62" y="470" font-size="15" font-weight="700" fill="#581c87">Smoke-test Job (busybox)</text>
  <text x="62" y="492" font-size="12" fill="#6b21a8">Builds each pod FQDN from the storage-env ConfigMap, then checks:</text>
  <text x="62" y="512" font-size="12" fill="#6b21a8">1) DNS resolution (nslookup) for MySQL and MinIO</text>
  <text x="62" y="530" font-size="12" fill="#6b21a8">2) TCP reachability (nc -z) on :3306 and :9000</text>
  <text x="62" y="548" font-size="12" fill="#6b21a8">Run by the bootstrap script; fails the run if any check fails</text>

  <!-- arrows -->
  <line x1="189" y1="294" x2="189" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="199" y="310" font-size="11" fill="#475569">JDBC</text>
  <line x1="314" y1="229" x2="382" y2="229" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="322" y="221" font-size="11" fill="#475569">S3A config</text>
  <line x1="189" y1="444" x2="189" y2="408" stroke="#9333ea" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- planned -->
  <rect x="706" y="126" width="240" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="722" y="152" font-size="14" font-weight="700" fill="#475569">Planned: compute</text>
  <text x="722" y="176" font-size="12" fill="#64748b">Spark · Trino · Flink</text>
  <text x="722" y="196" font-size="12" fill="#64748b">Read/write tables through the</text>
  <text x="722" y="212" font-size="12" fill="#64748b">shared Hive Metastore, with data</text>
  <text x="722" y="228" font-size="12" fill="#64748b">stored as Parquet in MinIO</text>
  <rect x="706" y="306" width="240" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="722" y="332" font-size="14" font-weight="700" fill="#475569">Planned: ingestion</text>
  <text x="722" y="356" font-size="12" fill="#64748b">Batch loads from the Brazilian</text>
  <text x="722" y="372" font-size="12" fill="#64748b">e-commerce dataset into the</text>
  <text x="722" y="388" font-size="12" fill="#64748b">Bronze (raw) layer</text>
  <path d="M706 361 H690 V250 H636" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <path d="M706 150 H189 V162" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="706" y="452" font-size="12" fill="#64748b">Solid = in the repo today</text>
  <text x="706" y="472" font-size="12" fill="#64748b">Dashed = planned, not built yet</text>
</svg>

# '''
# Why PVC (Persistent Volume Claim)?
#-By default, containers are ephemeral (data disappears if pod restarts).
#-PVC ensures data persists across restarts.
#-Example: we don’t want MinIO data to vanish if the pod crashes.
# '''

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: storage
spec:
  accessModes:
  - ReadWriteOnce #the volume can be mounted as read-write-once by a single node, and can be used by any number of Pods within that node
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path #Use k3s dynmaic provisioner


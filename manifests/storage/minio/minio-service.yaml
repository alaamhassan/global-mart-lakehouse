# # '''
# # This defines a Kubernetes Service.
# #   - A Service is an abstraction that gives you a stable network endpoint to reach one or more pods.
# #   - Without a Service, your pods would only be reachable by their internal IPs, which change when pods restart.
# #   Why: MinIO needs a stable address so you (and Spark, Kafka, etc.) can always connect.
# # '''
# apiVersion: v1
# kind: Service
# metadata:
#   name: minio-service
#   namespace: storage
# spec:
#   ports:
#     - name: s3-api #the port clients will use when they connect to the Service.
#       port: 9000 #The port exposed by the Service (inside the cluster).
#       targetPort: s3-api #forwards traffic to port 9000 in the MinIO pod.
#       nodePort: 31000
#     - name: console # MinIO Web Console (for humans to log in and manage buckets).
#       port: 9090 
#       targetPort: console
#       nodePort: 31001
#   selector:
#     app: minio
#   type: NodePort



apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: storage
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
    - name: console
      port: 9090


#   '''
# 3️⃣ Difference between Service Types
# Kubernetes Services have 3 main types (plus a couple of special ones):
#   1. ClusterIP (default)
#     - Exposes service inside the cluster only.
#     - Other pods can talk to it (minio-service:9000), but not outside world.
#     - ✅ Best for internal microservices.
#   2. NodePort
#     - Exposes service outside cluster via a port on every node (30000–32767).
#     - You reach it at http://<node-ip>:<nodeport>.
#     - ✅ Simple for dev/local, no cloud load balancer needed.

#   3. LoadBalancer
#     - Integrates with cloud provider (AWS ELB, GCP LB).
#     - Automatically provisions a public IP.
#     - ✅ Best for production on cloud.

#   (Bonus) ExternalName → maps a Service to an external DNS name.

#   For your portfolio (bare-metal VM / k3s), NodePort is best.
#   Later if you move this to cloud → use LoadBalancer.
#   '''


#   '''
#   🔑 What is a Node?
#     A Node is a single machine (physical or virtual) that runs part of your Kubernetes cluster.
#       - Master Node (Control Plane) → runs the brain of Kubernetes (API server, scheduler, controller manager, etc.).
#       - Worker Node → runs your actual applications (pods).
#     Each Node runs:
#       - kubelet → talks to the API server, makes sure pods are running.
#       - kube-proxy → handles networking/routing inside the cluster.
#       - Container runtime (Docker, containerd) → actually runs your containers.
#     In simple words:
#       - Cluster = the whole system.
#       - Node = one machine inside the cluster.
#       - Pods = workloads running on nodes.
#     📌 Example:
#       - If you install k3s on one VM → that VM is one Node.
#       - If you add 2 more VMs → now you have 3 Nodes in the cluster
      
#   '''

#   '''
#   1️⃣ Where did 31000 and 31001 come from?
#   In Kubernetes, when you use type: NodePort, Kubernetes opens a port on every Node in the cluster.
#     By default, it picks a random port in the range 30000–32767.
#       Example: it might assign 31544 or 30211 automatically.
#         In your Service, I manually set:
#         - nodePort: 31000   # for 9000
#         - nodePort: 31001   # for 9090
#     so it’s predictable (always the same number), instead of random.
#   📌 You can pick any free number in the 30000–32767 range.
#   '''

#   '''
#   2️⃣ The Difference: port, targetPort, nodePort
#   🔹 targetPort
#         The port inside the pod/container where the app is listening.
#         - MinIO listens on 9000 (API) and 9090 (console).
#         - So targetPort: 9000 means → forward to port 9000 inside the MinIO container.
#       -> Think: “Where does the traffic land inside the pod?”

#       🔹 port
#         The port exposed by the Service (inside the cluster).
#         - Other pods can reach this Service at minio-service:9000.
#         - Usually, you keep port = targetPort for simplicity, but they can be different.
#       ->  Think: “What port do other pods use to reach the Service?”
      
#       🔹 nodePort
#         Only used when type: NodePort.
#         - Exposes the Service on each Node’s IP at a fixed port (30000–32767).
#         - Example: http://<node-ip>:31000.
#         Optional — if you don’t specify, Kubernetes picks one automatically.
#       -> Think: “What port can I use from outside the cluster?”
#   '''


#   '''
#   🔑 What does name: s3-api mean?
#     - It gives a name to the port definition.
#     - It doesn’t change functionality — the Service would still work without it.
#     - But it has several benefits:
  
#   ✅ Benefits of Naming Ports
#     1.Clarity & Documentation
#       - Instead of just seeing a number (9000), you immediately know this port is for the S3 API.
#       - If you have multiple ports (9000, 9090), names avoid confusion.
#     2.Reference in other resources
#       - Kubernetes Ingress, NetworkPolicies, or probes (livenessProbe, readinessProbe) can refer to ports by name instead of numbers.
#       - Example:
        
#         readinessProbe:
#           httpGet:
#             port: s3-api
        
#         This way, if you change the number later, you don’t have to update everywhere — just keep the name.
  
#     3.Multiple ports in one Service
#       - If a Service exposes more than one port (like 9000 and 9090 for MinIO), naming each makes it clear which is which.
#     4.Consistency across environments
#       - In dev, staging, prod → maybe ports differ. Using names in references makes YAML more portable.
  
#   Portfolio Angle
#   If an interviewer asks: “Why did you name the Service port?”
#   You can say:
#   “Naming ports is optional, but I did it for clarity and maintainability. 
#   It allows other Kubernetes resources like probes or Ingress to refer to 
#   ports by name instead of number, which makes manifests more readable and 
#   reduces errors when ports change.”
#   '''

#   '''
#   Perfect ⚡ you spotted the line where I mentioned **probes** and **Ingress**. Let me explain these clearly, with examples so you see how port naming helps.

# ---

# ## 1️⃣ Probes (Liveness & Readiness)

#   Kubernetes uses **probes** to check the health of containers.
#   * **Liveness Probe** → “Is the container still alive? If not, restart it.”
#   * **Readiness Probe** → “Is the container ready to receive traffic? If not, don’t send traffic to it yet.”
#   Normally, you define them like this:

#   ```yaml
#   readinessProbe:
#     httpGet:
#       path: /minio/health/ready
#       port: 9000
#   ```
#   -
#   > Problem: if you change the Service from port `9000` to `9100`, you have to update the probe too.

#   ✅ Solution with **named port**:

#   ```yaml
#   ports:
#     - name: s3-api
#       port: 9000
#       targetPort: 9000
#   ```

#   Then you can write:

#   ```yaml
#   readinessProbe:
#     httpGet:
#       path: /minio/health/ready
#       port: s3-api   # referring by name
#   ```

#   Now if the port number changes, as long as the name `s3-api` stays the same, you don’t have to update the probe.

#   ---

#   ## 2️⃣ Ingress

#   An **Ingress** is a Kubernetes object that manages **external HTTP/HTTPS access** to services (like a reverse proxy).

#   Without Ingress:

#   * You expose apps with NodePort or LoadBalancer.

#   With Ingress:

#     * You can map hostnames/paths → Services.
#     * Example: `minio.globalmart.local/api` → forwards to MinIO’s 9000.
#     * Example: `minio.globalmart.local/console` → forwards to MinIO’s 9090.

#     ### Using port **number**:

#     ```yaml
#     backend:
#       service:
#         name: minio-service
#         port:
#           number: 9000
#     ```

#     ### Using port **name**:

#     ```yaml
#     backend:
#       service:
#         name: minio-service
#         port:
#           name: s3-api
#     ```

#   -> Again, if you later change the port from `9000` to `9100`, you don’t need to update the Ingress as long as you keep `name: s3-api`.

#   ---

#   ## ✅ Why This Matters

#     * **Without names** → you have to hardcode numbers everywhere.
#     * **With names** → you use consistent labels (`s3-api`, `console`) across Deployments, Services, Probes, Ingress.
#     * Much safer in real projects, where configs evolve often.

#   ---

#   📌 Interview-ready answer if asked:

#   > “I used named ports in the Service because Kubernetes features like liveness/readiness probes and Ingress can refer to ports by name. This makes manifests easier to maintain — if I change the port number, I only update it in one place, not across multiple configs.”

#   ---
# '''







# '''
# ## 🔑 what not using ingress in this project
#   Ingress is like a **reverse proxy / smart router** for your cluster.
#   It lets you:
#     * Expose Services via HTTP/HTTPS without using NodePort or LoadBalancer.
#     * Route traffic based on **hostnames** or **paths**.
#   Example:
#     * `http://minio.local/api` → forwards to MinIO Service on port 9000.
#     * `http://minio.local/console` → forwards to MinIO Service on port 9090.

#   To use Ingress, you also need an **Ingress Controller** (like Nginx, Traefik, HAProxy).

# ---

# ## ⚖️ Why we’re not using Ingress *right now*

# ### ✅ Pros of skipping Ingress in Phase 1

#   1. **Simplicity**

#     * You’re just starting the infrastructure layer.
#     * NodePort is the simplest way to access MinIO and MySQL from your VM.

#   2. **No extra dependencies**

#     * Ingress requires installing and configuring an Ingress Controller.
#     * That adds complexity (certificates, DNS, etc.), which we don’t need yet.

#   3. **Not HTTP-based for everything**

#     * MinIO’s S3 API can use HTTP, but MySQL is not HTTP (it’s TCP).
#     * Ingress is really built for web apps, not databases.

#   4. **Portfolio focus**

#     * In Phase 1, your goal is to show you can stand up the **core storage layer** (PVCs, Deployments, Services).
#     * Ingress makes more sense when you add **Airflow, Spark UI, NiFi UI** later.

# ---

# ## 🚀 When we might add Ingress later

#   Once your cluster grows (Phase 2+), Ingress becomes valuable:

#   * **Airflow UI** → access via `http://airflow.local/`.
#   * **NiFi UI** → access via `http://nifi.local/`.
#   * **MinIO Console** → access via `http://minio.local/console`.
#   * All managed via a single Ingress Controller instead of multiple NodePorts.

#   That’s when Ingress starts to make the project look very **enterprise-like**.

# ---

# ## ✅ Senior Advice

#   * **Phase 1 (Foundation layer)** → Stick with **NodePort** (simple, no extra dependencies).
#   * **Phase 2 (Processing + Orchestration)** → Add an Ingress Controller (like Nginx Ingress or Traefik) to consolidate access to UIs (Airflow, NiFi, MinIO Console).

#   📌 In interviews, you can say:

#   > “I started with NodePort for simplicity during the storage setup. 
#   Later in the project, once multiple UIs are involved, I would install 
#   an Ingress Controller to manage all services behind a single entry point. 
#   That way, I can map hostnames like airflow.local or minio.local instead of 
#   juggling NodePorts.”

#   '''
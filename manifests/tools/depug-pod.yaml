apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: storage
spec:
  containers:
  - name: depug
    image: busybox:1.36
    command: ["sleep","3600"]

#     ''' for the image bitnami/kubectl:latest

# Explanation

# A debug pod is extremely useful:

# Inside the pod you can:
#     kubectl exec -it debug -n tools -- sh

# Then test:
#     curl mysql.storage.svc.cluster.local:3306
#     curl minio.storage.svc.cluster.local:9000

# This is real-world debugging.
    
#     '''